name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # macOS is the primary development platform, and both SQLite FTS5
          # compile options and portalocker's locking semantics differ there.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e .[dev]
      - run: python -m pytest -q
      # Retrieval quality regression gates on the fixed 50-query corpus. The
      # bm25 gate covers the in-memory scorer; the full gate goes through
      # SQLite FTS5 + fusion, i.e. the path search and the hooks actually take.
      - run: python -m mnemosyne eval run --min-recall 0.95
      - run: python -m mnemosyne eval run --longmemeval --pipeline full --min-recall 0.95

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check mnemosyne tests

  extras:
    # Verify the optional dependency sets still install and import; their
    # upstreams (numpy/onnxruntime/mcp) are otherwise never exercised in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .[vector,rerank,mcp]
      - run: python -c "import mnemosyne.embedding.onnx, mnemosyne.rerank.cross_encoder, mnemosyne.mcp.server"

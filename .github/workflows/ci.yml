name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
      # Retrieval quality regression gate: any search-pipeline change that
      # drops recall@5 on the fixed 50-query corpus below 0.95 fails CI.
      - run: python -m mnemosyne eval run --min-recall 0.95

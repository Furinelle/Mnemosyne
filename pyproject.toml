[project]
name = 'mnemosyne'
version = '0.3.1'
description = 'Portable dual-agent memory system for LLM agents'
requires-python = '>=3.11'
dependencies = ['portalocker>=2.8']

[project.optional-dependencies]
vector = ['numpy>=1.26', 'onnxruntime>=1.17']
rerank = ['numpy>=1.26', 'onnxruntime>=1.17']
mcp = ['mcp>=0.4,<1']
distill = []

[project.scripts]
mnemosyne = 'mnemosyne.cli:main'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
include = ['mnemosyne/**', 'templates/**']

[tool.hatch.build.targets.sdist]
include = ['mnemosyne/**', 'templates/**', 'tests/**', 'README.md', 'pyproject.toml']
